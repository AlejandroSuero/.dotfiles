---
- name: System | Formulaes | {{ ansible_distribution }}
  community.general.homebrew:
    name:
      - jq
      - xclip
      - gnu-tar
      - eza
      - ffmpeg
      - imagemagick
      - wget
      - telnet
      - tldr
      - gpg
    state: present

- name: System | Casks | {{ ansible_distribution }}
  community.general.homebrew_cask:
    name:
      - alt-tab
      - hiddenbar
      - stats
      - time-out
      - vlc
      - keepingyouawake
    state: present

